name: one_tome
description: One book at a time. Finish what you start. Local-first PDF reader.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  file_picker: ^13.3.2
  pdfrx: ^2.11.0
  intl: ^0.20.3
  uuid: ^4.6.0
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
