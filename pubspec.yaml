name: one_tome
description: One book at a time. Finish what you start. Local-first PDF reader.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  pdfrx: ^2.1.0
  intl: ^0.19.0
  uuid: ^4.4.2
  audioplayers: ^6.1.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/logo.png
